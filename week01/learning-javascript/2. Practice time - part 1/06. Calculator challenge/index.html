<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h2 id="heading">Basic Calculator</h2>
    <input id="first-num" type="number" placeholder="Enter first Number" />
    <input id="second-num" type="number" placeholder="Enter Second Number" />
    <br />
    <button id="add-btn" onclick="add()">Add</button>
    <button id="sub-btn" onclick="subtract()">Subtract</button>
    <button id="div-btn" onclick="divide()">Divide</button>
    <button id="mut-btn" onclick="multiply()">Multiply</button>
    <br />
    <p id="result">Result</p>
    <script src="index.js"></script>
  </body>
</html>
